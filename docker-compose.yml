services:
  postgres:
    image: postgres:16
    container_name: elkoko_db
    environment:
      POSTGRES_DB: elkoko
      POSTGRES_USER: elkoko
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: elkoko_redis
    ports:
      - "6379:6379"

  rembg:
    build:
      context: ./backend
      dockerfile: Dockerfile.rembg
    container_name: elkoko_rembg
    ports:
      - "5001:5001"
    restart: unless-stopped

volumes:
  postgres_data:
