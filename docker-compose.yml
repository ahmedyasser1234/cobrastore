services:
  postgres:
    image: postgres:16
    container_name: elkoko_db
    environment:
      POSTGRES_DB: elkoko
      POSTGRES_USER: elkoko
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: elkoko_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
